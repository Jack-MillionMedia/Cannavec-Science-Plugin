[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cannavec-science"
version = "0.7.0"
description = "Elite-tier cannabis-science primitives for the working researcher (Cannavec Science Claude Code plugin, v0.7 citation-accuracy, recall & cannabinoid-receptor-mechanism-claims build, building on the v0.6 research-domain-breadth release). Adds four curated registries on top of the v0.5 clinical-pharmacology-depth backbone: pain medicine (≥ 7 rows — NASEM 2017 chapter-4 conclusive-evidence finding for chronic pain anchored to Whiting 2015 JAMA SR PMID 26103030, Stockings 2018 PAIN SR PMID 29847469, Mücke 2018 Cochrane neuropathic PMID 29513392, Boehnke 2019 J Pain MMJ cohort PMID 30690169, Andreae 2015 IPD meta-analysis PMID 26362106, de Vita 2018 experimental-pain SR PMID 30422266), cannabis-and-psychosis psychiatry (≥ 6 rows — Di Forti 2019 EU-GEI Lancet Psychiatry PMID 30902669, Marconi 2016 Schizophr Bull dose-response SR PMID 26884547, Vaucher 2018 Mendelian-randomization Mol Psychiatry PMID 28115737, Bhattacharyya 2009 acute-THC fMRI Arch Gen Psychiatry PMID 19349314, Hjorthøj 2023 Lancet Psychiatry Danish national-register cohort PMID 37140715, Murray 2017 Lancet Psychiatry narrative review), driving-impairment science (≥ 5 rows — Compton 2017 NHTSA Virginia Beach case-control DOT HS 812 411, Hartman 2015 Clin Chem plasma-THC dose-response PMID 26144593, Marcotte 2022 JAMA Psychiatry simulator RCT PMID 35080588, Brubacher 2022 NEJM BC post-legalization cohort PMID 35020985, Bondallaz 2016 Forensic Sci Int SR PMID 27701009), and PTSD / anxiety / sleep (≥ 5 rows — Bonn-Miller 2021 PLOS One PTSD smoked-cannabis RCT PMID 33730032 with the largely-negative primary endpoint honestly stated, Crippa 2011 J Psychopharmacol CBD-SAD SPECT PMID 20829306, Bergamaschi 2011 Neuropsychopharm CBD-SAD speech PMID 21307846, Childs 2017 Drug Alcohol Depend biphasic acute Δ⁹-THC anxiety PMID 28599212, Suraev 2020 Sleep Med Rev cannabinoids-and-sleep SR PMID 32603954). Adds the reporting-rigor module: six EQUATOR-network detectors (CONSORT for RCTs per Schulz 2010 BMJ PMID 20335313, PRISMA-2020 for SRs per Page 2021 BMJ PMID 33781993, STROBE for observational studies per von Elm 2007 PMID 17938396, ROB-2 for RCT bias per Sterne 2019 BMJ PMID 31462531, ROBINS-I for non-randomized intervention studies per Sterne 2016 BMJ PMID 27733354, AMSTAR-2 for SR quality per Shea 2017 BMJ PMID 28935701) integrated into the existing rigor-check report. Adds OpenAlex as a thirteenth primary-source live-discovery lane (open scholarly citation graph; PubMed + preprints + conference proceedings + open citation network). Five commands; twenty curated science registries with freshness watch; seven cannabis-phytochemistry rigor detectors plus six reporting-rigor detectors with (detector, span) deduplication; 16 banned-pattern detectors; safety preflight; span-aware named-cannabinoid resolution; topical-relevance grade aggregation; cannabis-noun → cannabinoid-set expansion; identifier verification across all five Constitution §I shapes (PMID, DOI, NCT, ChEMBL, UniProt); registry inventory subcommand; honest 0-claim classification with rendered hints; retraction enforcement at composition time; live discovery across thirteen primary-source databases (PubMed, ChEMBL, ClinicalTrials.gov, PubChem, PharmGKB, RCSB PDB, Open Targets, GWAS Catalog, BindingDB, bioRxiv, medRxiv, Europe PMC, OpenAlex) with deterministic cross-source synthesis and citation-network analysis; researcher-workflow scaffolders (PICO, power calculation, GRADE evidence-profile, IRB protocol skeleton); regulatory-feasibility advisory (US / EU / Canada / UK); BibTeX/RIS/CSL-JSON bibliography export with inline GRADE annotation. Researcher audience only. Stdlib-only Python ≥ 3.9."
authors = [{ name = "Jack-MillionMedia" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "cannabis", "evidence-grading", "GRADE", "phytochemistry",
    "pharmacology", "research", "claude-code-plugin",
    "pubmed", "chembl", "clinicaltrials",
    "biorxiv", "medrxiv", "preprint", "europepmc",
    "endocannabinoidome", "ecbome", "regulatory-feasibility",
    "power-calculation", "pico", "irb-protocol", "citation-network",
    "analytical-chemistry", "decarboxylation-kinetics", "hplc",
    "chemovar", "cultivation-science", "synthase-genetics",
    "trichome-biology", "botanical-taxonomy",
    # v0.5 — clinical-pharmacology depth.
    "pharmacokinetics", "ADME", "first-pass-effect",
    "cannabis-use-disorder", "CUD", "CUDIT-R",
    "cannabis-withdrawal-syndrome", "DSM-5",
    "cannabinoid-hyperemesis-syndrome", "CHS",
    "FAAH-inhibitor", "MAGL-inhibitor",
    "PF-04457845", "BIA-10-2474", "ABX-1431",
    "cannabinoid-biosynthesis", "olivetolic-acid",
    "THCA-synthase", "CBDA-synthase",
    "heterologous-expression",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Stdlib-only by constitution. No `pip install` required to run.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Jack-MillionMedia/Cannavec-Science-Plugin"
Source = "https://github.com/Jack-MillionMedia/Cannavec-Science-Plugin"
Issues = "https://github.com/Jack-MillionMedia/Cannavec-Science-Plugin/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["cannavec_science*"]
exclude = ["tests*", "evals*"]

[tool.setuptools.package-data]
cannavec_science = ["data/*.csv"]
