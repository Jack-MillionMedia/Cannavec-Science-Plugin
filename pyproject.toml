[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cannavec-science"
version = "0.8.0"
description = "A grounding-and-verification layer that makes AI trustworthy for cannabis-science research (Cannavec Science Claude Code plugin). Five commands (research / ask / discover / verify / rigor): the model reasons over live primary-source retrieval (PubMed, ClinicalTrials.gov, ChEMBL, and more), while deterministic stdlib code verifies every identifier is real and not retracted (PMID / DOI / NCT / ChEMBL / UniProt), enforces retractions, assigns GRADE, and runs safety + banned-pattern + phytochemistry-rigor detectors. Twenty-one curated science registries (>= 230 rows) are clearly-labelled offline reference the model reasons over, never presented as the answer itself. Researcher audience only. Stdlib-only Python >= 3.9; the verification core is fully offline-checkable."
authors = [{ name = "Jack-MillionMedia" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "cannabis", "evidence-grading", "GRADE", "phytochemistry",
    "pharmacology", "research", "claude-code-plugin",
    "pubmed", "chembl", "clinicaltrials",
    "biorxiv", "medrxiv", "preprint", "europepmc",
    "endocannabinoidome", "ecbome", "regulatory-feasibility",
    "power-calculation", "pico", "irb-protocol", "citation-network",
    "analytical-chemistry", "decarboxylation-kinetics", "hplc",
    "chemovar", "cultivation-science", "synthase-genetics",
    "trichome-biology", "botanical-taxonomy",
    # v0.5 — clinical-pharmacology depth.
    "pharmacokinetics", "ADME", "first-pass-effect",
    "cannabis-use-disorder", "CUD", "CUDIT-R",
    "cannabis-withdrawal-syndrome", "DSM-5",
    "cannabinoid-hyperemesis-syndrome", "CHS",
    "FAAH-inhibitor", "MAGL-inhibitor",
    "PF-04457845", "BIA-10-2474", "ABX-1431",
    "cannabinoid-biosynthesis", "olivetolic-acid",
    "THCA-synthase", "CBDA-synthase",
    "heterologous-expression",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Stdlib-only by constitution. No `pip install` required to run.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Jack-MillionMedia/Cannavec-Science-Plugin"
Source = "https://github.com/Jack-MillionMedia/Cannavec-Science-Plugin"
Issues = "https://github.com/Jack-MillionMedia/Cannavec-Science-Plugin/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["cannavec_science*"]
exclude = ["tests*", "evals*"]

[tool.setuptools.package-data]
cannavec_science = ["data/*.csv"]
