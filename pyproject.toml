[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cannavec-science"
version = "0.2.0"
description = "Elite-tier cannabis-science primitives for the working researcher (Cannavec Science Claude Code plugin v0.2). GRADE evidence-grading with deterministic citation-network-driven downgrades, 15 banned-pattern detectors, safety preflight, seven phytochemistry rigor checks (incl. entourage-overclaim detector), PubMed / Crossref citation verification with forward-cite pushback signal, retraction enforcement at composition time, eight science registries with freshness watch, live discovery across eleven primary-source databases (PubMed, ChEMBL, CT.gov, PubChem, PharmGKB, RCSB, Open Targets, GWAS, BindingDB, bioRxiv, medRxiv), researcher-workflow scaffolders (PICO, sample-size power, GRADE evidence-profile, IRB protocol skeleton), regulatory-feasibility advisory, endocannabinoidome reference, BibTeX / RIS / CSL-JSON bibliography export."
authors = [{ name = "Jack-MillionMedia" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "cannabis", "evidence-grading", "GRADE", "phytochemistry",
    "pharmacology", "research", "claude-code-plugin",
    "pubmed", "chembl", "clinicaltrials",
    "biorxiv", "medrxiv", "preprint",
    "endocannabinoidome", "ecbome", "regulatory-feasibility",
    "power-calculation", "pico", "irb-protocol", "citation-network",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Stdlib-only by constitution. No `pip install` required to run.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Jack-MillionMedia/Cannavec-Science-Plugin"
Source = "https://github.com/Jack-MillionMedia/Cannavec-Science-Plugin"
Issues = "https://github.com/Jack-MillionMedia/Cannavec-Science-Plugin/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["cannavec_science*"]
exclude = ["tests*", "evals*"]
