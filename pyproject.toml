[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cannavec-science"
version = "0.3.0"
description = "Elite-tier cannabis-science primitives for the working researcher (Cannavec Science Claude Code plugin v0.3). GRADE evidence-grading with deterministic citation-network-driven downgrades and topical-relevance grade aggregation, 15 banned-pattern detectors, safety preflight, seven phytochemistry rigor checks (incl. entourage-overclaim detector), span-aware named-cannabinoid resolution (no Δ⁹-THC monograph for Δ⁸-THC queries), cannabinoid-scoped AE / interaction / contraindication / population registry detectors, cannabis-noun → cannabinoid-set expansion for partner-drug matching, eCBome registry threaded into compose_answer, identifier verification across all five Constitution §I shapes (PMID, DOI, NCT, ChEMBL, UniProt), registry inventory subcommand, retraction enforcement at composition time, eight science registries with freshness watch, live discovery across eleven primary-source databases, researcher-workflow scaffolders (PICO, sample-size power, GRADE evidence-profile, IRB protocol skeleton), regulatory-feasibility advisory, BibTeX / RIS / CSL-JSON bibliography export."
authors = [{ name = "Jack-MillionMedia" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "cannabis", "evidence-grading", "GRADE", "phytochemistry",
    "pharmacology", "research", "claude-code-plugin",
    "pubmed", "chembl", "clinicaltrials",
    "biorxiv", "medrxiv", "preprint",
    "endocannabinoidome", "ecbome", "regulatory-feasibility",
    "power-calculation", "pico", "irb-protocol", "citation-network",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Stdlib-only by constitution. No `pip install` required to run.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Jack-MillionMedia/Cannavec-Science-Plugin"
Source = "https://github.com/Jack-MillionMedia/Cannavec-Science-Plugin"
Issues = "https://github.com/Jack-MillionMedia/Cannavec-Science-Plugin/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["cannavec_science*"]
exclude = ["tests*", "evals*"]
