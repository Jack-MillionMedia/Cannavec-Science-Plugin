name: CI

# Two gates for Cannavec Science:
#   * tests          — the offline, stdlib-only unit suite (Constitution §III,
#                      spec 007). Runs on every push / PR; no network, no secrets.
#   * citation-audit — the ONLINE guard the offline suite cannot provide: it
#                      checks that every curated PMID still resolves to the paper
#                      its label claims (evals/audit_pmids.py). A well-formed but
#                      wrong PMID passes all offline tests, so this gates every
#                      PR (and runs weekly) against live PubMed. A PMID that
#                      cannot be fetched is inconclusive, never a false failure.
#
# Note: the offline `tests` job also runs tests/test_citation_integrity_guard.py
# — a denylist of identifiers confirmed wrong in the past, enforced with zero
# network so it can never silently fail to run. citation-audit is the online
# net for *new* mistakes; the guard is the always-on floor for known ones.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # 06:00 UTC every Monday
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Offline / deterministic — the Constitution's gate. Skip on schedule
    # (the weekly run is only for the live citation audit).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline unit suite (stdlib only — zero installs)
        run: python3 -m unittest discover -s tests

  citation-audit:
    # Online integrity gate. Runs on every PR (so a wrong identifier blocks
    # merge — mark this check "required" in branch protection to enforce it),
    # plus a weekly full sweep and on demand. PR-time network flakiness is no
    # longer a problem: an unfetchable PMID is reported inconclusive, not a
    # suspect, so only a genuine wrong-paper mismatch fails the build. Add an
    # NCBI_API_KEY repo secret to lift the rate limit; the job still runs
    # without it, just slower.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit curated PMIDs against live PubMed
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python3 evals/audit_pmids.py
